<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind – Lost &amp; Found System</title>
  <link rel="stylesheet" href="/stylesheets/style.css">

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- React Router DOM v5 (exposes window.ReactRouterDOM) -->
  <script src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js"></script>

  <!-- Babel for JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- ── Core API Service ─────────────────────────────────── -->
  <script src="/javascripts/api.js"></script>

  <!-- ── Auth Components ─────────────────────────────────── -->
  <script type="text/babel" src="/javascripts/components/auth/Login.jsx"></script>
  <script type="text/babel" src="/javascripts/components/auth/Register.jsx"></script>

  <!-- ── Shared Components ───────────────────────────────── -->
  <script type="text/babel" src="/javascripts/components/shared/Navbar.jsx"></script>
  <script type="text/babel" src="/javascripts/components/shared/ClaimItem.jsx"></script>

  <!-- ── Page Components ─────────────────────────────────── -->
  <script type="text/babel" src="/javascripts/pages/Home.jsx"></script>
  <script type="text/babel" src="/javascripts/pages/BrowseItems.jsx"></script>
  <script type="text/babel" src="/javascripts/pages/ItemDetail.jsx"></script>
  <script type="text/babel" src="/javascripts/pages/PostItem.jsx"></script>
  <script type="text/babel" src="/javascripts/pages/EditItem.jsx"></script>
  <script type="text/babel" src="/javascripts/pages/MyClaims.jsx"></script>
  <script type="text/babel" src="/javascripts/pages/StaffDashboard.jsx"></script>
  <script type="text/babel" src="/javascripts/pages/AuthRequired.jsx"></script>
  <script type="text/babel" src="/javascripts/pages/NotFound.jsx"></script>

  <!-- ── Main App (mount point) ──────────────────────────── -->
  <script type="text/babel" src="/javascripts/components/App.jsx"></script>
</body>
</html>
